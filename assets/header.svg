<rect class="sc" x="0" y="0" width="140" height="340" fill="#fff" opacity=".035" transform="skewX(-20)"/>
<text x="500" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="16" letter-spacing="6" fill="#38BDF8" class="hi">&lt; HELLO, WORLD /&gt;</text>
