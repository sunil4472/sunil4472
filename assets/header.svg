<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050813"/><stop offset="1" stop-color="#0D1535"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#F0ABFC"/><animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#818CF8"/><stop offset="1" stop-color="#E879F9"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="cl"><rect width="1000" height="340" rx="28"/></clipPath>
</defs>
<style>
.p{animation:fl ease-in-out infinite;opacity:.7}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-26px);opacity:.95}}
.b1{animation:m1 14s ease-in-out infinite}.b2{animation:m2 17s ease-in-out infinite}.b3{animation:m3 20s ease-in-out infinite}
@keyframes m1{0%,100%{transform:translate(0,0)}50%{transform:translate(220px,50px)}}
@keyframes m2{0%,100%{transform:translate(0,0)}50%{transform:translate(-200px,-30px)}}
@keyframes m3{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,-60px)}}
.r{opacity:0;animation:cy 9s infinite}.r2{animation-delay:3s}.r3{animation-delay:6s}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}
.dot{animation:pl 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.hi{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sc{animation:sc 5s linear infinite}
@keyframes sc{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
</style>
<g clip-path="url(#cl)">
<rect width="1000" height="340" fill="url(#bg)"/>
<g filter="url(#bl)" opacity=".85">
<circle class="b1" cx="180" cy="90" r="120" fill="#2563EB"/>
<circle class="b2" cx="800" cy="260" r="130" fill="#7C3AED"/>
<circle class="b3" cx="520" cy="300" r="100" fill="#06B6D4"/>
